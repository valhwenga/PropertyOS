name: CI

on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      AUTH_PROVIDER: local
      EMAIL_PROVIDER: sink

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The committed lockfile is authoritative: a drifted lockfile fails here.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @propertyos/web typecheck

      # Rebuilds the schema from empty on every run, so migration
      # reproducibility is continuously proven rather than assumed.
      - name: Tests (unit, RLS isolation, financial invariants, integration)
        run: pnpm test

      - name: Build
        run: pnpm --filter @propertyos/web build
