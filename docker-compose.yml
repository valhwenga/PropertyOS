# Local full-stack run: database, web and worker.
# NOT a production topology — there is no TLS termination, no backup schedule
# and no secret management here. See docs/deployment.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: propertyos
    ports: ['5432:5432']
    volumes: ['propertyos-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runtime
      args: { APP_REVISION: '${APP_REVISION:-dev}' }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/propertyos
      APP_DATABASE_URL: postgresql://propertyos_app_login:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/propertyos
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sink}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports: ['3000:3000']

  worker:
    build:
      context: .
      target: worker
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/propertyos
      WORKER_ID: worker-compose-1
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sink}

volumes:
  propertyos-db:
